apply:
  - //common.module-template.yaml
repositories:
  - https://jitpack.io
  - https://raw.githubusercontent.com/MetaCubeX/maven-backup/main/releases
  - id: lucide-compose
    url: https://maven.pkg.github.com/YumeYucca/lucide-compose
    credentials:
      file: local.properties
      usernameKey: gpr.user
      passwordKey: gpr.key
settings:
  jvm:
    release: 25
  kotlin:
    serialization: enabled
    ksp:
      version: 2.3.12
  android:
    compileSdk: 37
    targetSdk: 37
    minSdk: 26
    buildToolsVersion: 37.0.0
