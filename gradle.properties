project.name=YumeBox
project.version.name=0.6.3
# versionCode EPOCH for :app (and the literal versionCode of :extension). CI builds add the
# commit count (`git rev-list --count HEAD`, injected via -Pbuild.number by
# reusable-build-apk-only.yml); local builds use the epoch alone. Only bump this if the new
# sequence must jump above an already-published versionCode (e.g. after a history rewrite
# shrinks the commit count). reusable-prepare-publish.yml greps this key by name.
project.version.code=5795
project.jvm=25
# ============================================
# Namespace Configuration (project.namespace.*)
# ============================================
project.namespace.base=com.github.yumeyucca.yumebox
project.namespace.core=${project.namespace.base}.core
project.namespace.extension=${project.namespace.base}.extension
# ============================================
# Android SDK Configuration (android.*)
# ============================================
android.compileSdk=37
android.compileSdkMinor=0
android.minSdk=26
android.targetSdk=37
android.jvm=25
android.ndkVersion=30.0.14904198
# ============================================
# ABI Configuration (abi.*)
# ============================================
abi.app.list=arm64-v8a
abi.extension.list=arm64-v8a
# ============================================
# Gradle Configuration
# ============================================
# Android
android.useAndroidX=true
android.disallowKotlinSourceSets=false
android.enableNewApkCreator=true
android.enableR8.fullMode=true
android.packagingOptions.jniLibs.useLegacyPackaging=false
android.nonTransitiveRClass=true
android.r8.maxWorkers=4
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
# Gradle
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configureondemand=false
# Kotlin
kotlin.incremental=true
kotlin.daemon.jvm.options=-Xmx4g -XX:+UseG1GC
