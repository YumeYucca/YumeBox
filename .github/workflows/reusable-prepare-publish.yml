name: Prepare Publish

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      module:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string
      channel_segment:
        description: "Optional channel tag placed before the date/version tail in publish file names (e.g. pr); empty for the default pre channel and stable releases."
        required: false
        type: string
        default: ""
      release_tag:
        required: true
        type: string
      meta_asset_name:
        required: true
        type: string
      raw_apk_artifact_name:
        required: true
        type: string
      publish_artifact_name:
        description: "When non-empty, also upload one aggregate artifact with all publish APKs (only the stable release pipeline consumes it via the publish-<channel>-* pattern)."
        required: false
        type: string
        default: ""
      build_hash:
        description: "Commit sha of the build; first 8 chars go into versionName (<base>[.<branch>].<hash8>)."
        required: false
        type: string
        default: ""
      build_branch:
        description: "Branch name; normalized (lowercase, [^a-z0-9] runs -> '-') into the versionName branch segment."
        required: false
        type: string
        default: ""
      apk_name_tail:
        description: "APK name tail emitted by reusable-build-apk-only.yml."
        required: true
        type: string
    outputs:
      default_apk_name:
        description: "File name of the default publish APK (arm64-v8a, external geo) — reusable-notify-telegram.yml downloads its per-APK artifact by this exact name."
        value: ${{ jobs.prepare.outputs.default_apk_name }}
      builtin_apk_name:
        description: "File name of the arm64-v8a APK with bundled geo databases."
        value: ${{ jobs.prepare.outputs.builtin_apk_name }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      default_apk_name: ${{ steps.stem.outputs.external_arm64 }}.apk
      builtin_apk_name: ${{ steps.stem.outputs.builtin_arm64 }}.apk
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download raw APK artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.raw_apk_artifact_name }}
          path: raw-apk

      - name: Read version info
        id: version
        shell: bash
        env:
          BUILD_HASH: ${{ inputs.build_hash }}
          BUILD_BRANCH: ${{ inputs.build_branch }}
        run: |
          set -eu
          # Must mirror the versioning logic in app/build.gradle.kts:
          # versionCode = project.version.code (gradle.properties) + `git rev-list --count
          # HEAD` (needs the fetch-depth:0 checkout above; same commit count as the one
          # reusable-build-apk-only.yml baked into the APK, since both jobs of a run check
          # out the same github.sha), versionName = <base>[.<branch>].<hash8>, branch
          # normalized as lowercase, [^a-z0-9] runs -> '-', leading/trailing '-' trimmed.
          base_version_name="$(grep '^project.version.name=' gradle.properties | cut -d= -f2-)"
          base_version_code="$(grep '^project.version.code=' gradle.properties | cut -d= -f2-)"
          build_number="$(git rev-list --count HEAD)"
          branch_segment="$(printf '%s' "${BUILD_BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's/[^a-z0-9]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')"
          if [ -n "${BUILD_HASH}" ]; then
            if [ -n "${branch_segment}" ]; then
              version_name="${base_version_name}.${branch_segment}.${BUILD_HASH:0:8}"
            else
              version_name="${base_version_name}.${BUILD_HASH:0:8}"
            fi
          else
            version_name="${base_version_name}"
          fi
          version_code=$((base_version_code + build_number))
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"

      # Use the exact tail calculated before Gradle assembled the APKs. This avoids
      # a date rollover between the build and publishing jobs.
      - name: Compute publish file stems
        id: stem
        shell: bash
        run: |
          set -eu
          tail="${{ inputs.apk_name_tail }}"
          prefix="${{ inputs.artifact_prefix }}"
          channel_segment="${{ inputs.channel_segment }}"
          {
            echo "external_arm64=$(python3 scripts/ci_apk_stem.py "${prefix}" external arm64-v8a "${channel_segment}" "${tail}")"
            echo "builtin_arm64=$(python3 scripts/ci_apk_stem.py "${prefix}" builtin arm64-v8a "${channel_segment}" "${tail}")"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          set -eu
          mkdir -p publish/meta
          notes_file="publish/meta/release-notes.txt"

          if [ "${{ inputs.channel }}" = "stable" ]; then
            prev_tag="$(git tag --sort=-version:refname | grep '^v' | grep -Fxv "${{ inputs.release_tag }}" | head -n 1 || true)"
            if [ -n "$prev_tag" ]; then
              git log --pretty='- %s (%h)' "${prev_tag}..HEAD" > "$notes_file"
            else
              git log --pretty='- %s (%h)' -n 20 > "$notes_file"
            fi
          else
            git log --pretty='- %s (%h)' -n 20 > "$notes_file"
          fi

          if [ ! -s "$notes_file" ]; then
            echo "- No release notes." > "$notes_file"
          fi

      - name: Prepare publish artifacts
        shell: bash
        run: |
          set -eu
          mkdir -p publish
          version_name="${{ steps.version.outputs.version_name }}"
          version_code="${{ steps.version.outputs.version_code }}"
          stem_external="${{ steps.stem.outputs.external_arm64 }}"
          stem_builtin="${{ steps.stem.outputs.builtin_arm64 }}"
          release_url="https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}"
          publish_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          names=(
            "${stem_external}.apk"
            "${stem_builtin}.apk"
          )
          for name in "${names[@]}"; do
            test -f "raw-apk/${name}"
            cp -f "raw-apk/${name}" "publish/${name}"
          done

          actual="$(find publish -maxdepth 1 -type f -name '*.apk' | wc -l)"
          expected=2
          if [ "${actual}" -ne "${expected}" ]; then
            echo "Expected ${expected} publish APKs, got ${actual}:" >&2
            ls publish >&2
            exit 1
          fi

          export CHANNEL="${{ inputs.channel }}"
          export MODULE="${{ inputs.module }}"
          export ARTIFACT_PREFIX="${{ inputs.artifact_prefix }}"
          export RELEASE_TAG="${{ inputs.release_tag }}"
          export META_ASSET_NAME="${{ inputs.meta_asset_name }}"
          export VERSION_NAME="${version_name}"
          export VERSION_CODE="${version_code}"
          export RELEASE_URL="${release_url}"
          export PUBLISHED_AT="${publish_time}"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          publish_dir = Path("publish")
          release_notes_path = Path("publish/meta/release-notes.txt")
          channel = os.environ["CHANNEL"]
          module = os.environ["MODULE"]
          artifact_prefix = os.environ["ARTIFACT_PREFIX"]
          release_tag = os.environ["RELEASE_TAG"]
          meta_asset_name = os.environ["META_ASSET_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          version_name = os.environ["VERSION_NAME"]
          version_code = int(os.environ["VERSION_CODE"])
          release_url = os.environ["RELEASE_URL"]
          published_at = os.environ["PUBLISHED_AT"]
          release_notes = release_notes_path.read_text(encoding="utf-8").strip() if release_notes_path.exists() else ""

          packages = []
          for apk in sorted(publish_dir.glob("*.apk")):
              name = apk.name
              geo_bundled = name.startswith(f"{artifact_prefix}-builtin-")
              abi = "arm64-v8a"

              h = hashlib.sha256()
              with apk.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)

              packages.append({
                  "abi": abi,
                  "geoBundled": geo_bundled,
                  "fileName": name,
                  "downloadUrl": f"https://github.com/{repo}/releases/download/{release_tag}/{name}",
                  "size": apk.stat().st_size,
                  "sha256": h.hexdigest(),
                  "isUniversal": False,
              })

          meta = {
              "schemaVersion": 2,
              "channel": channel,
              "module": module,
              "artifactPrefix": artifact_prefix,
              "tag": release_tag,
              "versionName": version_name,
              "versionCode": version_code,
              "publishedAt": published_at,
              "commitSha": sha,
              "releaseNotes": release_notes,
              "releaseUrl": release_url,
              "packages": packages,
          }

          meta_dir = Path("publish/meta")
          meta_dir.mkdir(parents=True, exist_ok=True)
          (meta_dir / meta_asset_name).write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload publish artifact
        if: inputs.publish_artifact_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.publish_artifact_name }}
          path: publish/*.apk
          if-no-files-found: error
          # APKs are already zip-compressed; keep the archive (downstream jobs
          # download-artifact it) but store entries uncompressed.
          compression-level: 0

      # Per-APK artifacts: each published APK is uploaded separately with archive:false —
      # the raw .apk is stored as-is (no zip wrapper, no recompression) and downloads
      # directly as an installer. NOTE: with archive:false the artifact takes the FILE
      # name and the `name:` input is ignored, so these artifacts appear exactly as the
      # publish file names from "Prepare publish artifacts". The notification workflow downloads
      # both arm64-v8a variants via the outputs above.
      - name: Upload arm64-v8a APK artifact (external geo)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stem.outputs.external_arm64 }}
          path: publish/${{ steps.stem.outputs.external_arm64 }}.apk
          if-no-files-found: error
          archive: false

      - name: Upload arm64-v8a APK artifact (builtin geo)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stem.outputs.builtin_arm64 }}
          path: publish/${{ steps.stem.outputs.builtin_arm64 }}.apk
          if-no-files-found: error
          archive: false
