name: Build Telegram Bot API

on:
  workflow_call:

permissions:
  contents: read

env:
  TELEGRAM_BOT_API_COMMIT: adfd7f6a8e990272851777eeb3ae0def4216f161

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Cache Telegram Bot API
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: telegram-bot-api-install
          key: ${{ runner.os }}-telegram-bot-api-${{ env.TELEGRAM_BOT_API_COMMIT }}

      - name: Checkout Telegram Bot API
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: tdlib/telegram-bot-api
          ref: ${{ env.TELEGRAM_BOT_API_COMMIT }}
          path: telegram-bot-api-source
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install gperf ninja openssl@3

      - name: Build Telegram Bot API
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          cmake \
            -S telegram-bot-api-source \
            -B telegram-bot-api-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/telegram-bot-api-install" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3)"
          cmake --build telegram-bot-api-build --target install --parallel "$(sysctl -n hw.ncpu)"

      - name: Verify Telegram Bot API binary
        run: |
          set -eu
          test -x telegram-bot-api-install/bin/telegram-bot-api
          telegram-bot-api-install/bin/telegram-bot-api --help >/dev/null
          otool -L telegram-bot-api-install/bin/telegram-bot-api

      - name: Upload Telegram Bot API binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: telegram-bot-api-server
          path: telegram-bot-api-install
          if-no-files-found: error
          compression-level: 0
