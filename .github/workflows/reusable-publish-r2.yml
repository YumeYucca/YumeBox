name: Publish R2

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      apk_artifact_name:
        description: "Exact per-APK artifact name for the external arm64-v8a APK."
        required: true
        type: string
      meta_artifact_name:
        description: "Artifact containing the update manifest generated by reusable-prepare-publish.yml."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    concurrency:
      group: r2-publish-${{ inputs.channel }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      CHANNEL: ${{ inputs.channel }}
      PREFIX: releases
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate R2 configuration
        shell: bash
        run: |
          set -eu
          case "${CHANNEL}" in
            stable|nightly) ;;
            *) echo "Unsupported R2 channel: ${CHANNEL}" >&2; exit 1 ;;
          esac
          for name in R2_ACCOUNT_ID R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required configuration: ${name}" >&2
              exit 1
            fi
          done
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "Missing required R2 credentials" >&2
            exit 1
          fi

      - name: Download external APK
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.apk_artifact_name }}
          path: apk

      - name: Download update manifest
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.meta_artifact_name }}
          path: meta

      - name: Download current channel manifest
        id: existing
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p r2
          aws s3 cp "s3://${R2_BUCKET}/${PREFIX}/${CHANNEL}/latest.json" r2/existing.json \
            --endpoint-url "${R2_ENDPOINT}" \
            --only-show-errors

      - name: Verify R2 access
        if: steps.existing.outcome == 'failure'
        shell: bash
        run: |
          set -eu
          aws s3 ls "s3://${R2_BUCKET}/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --only-show-errors >/dev/null

      - name: Validate update manifest
        shell: bash
        run: |
          set -eu
          python3 scripts/publish_r2.py \
            --channel "${CHANNEL}" \
            --meta-dir meta \
            --apk-dir apk \
            --prefix "${PREFIX}" \
            --output-dir r2 \
            --existing-latest r2/existing.json
          cat r2/publish.env >> "$GITHUB_ENV"

      - name: Upload APK
        if: env.PUBLISH_LATEST == 'True'
        shell: bash
        run: |
          set -eu
          aws s3 cp "${APK_PATH}" "s3://${R2_BUCKET}/${APK_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/vnd.android.package-archive \
            --cache-control "public, max-age=300" \
            --only-show-errors

      - name: Upload channel manifest
        if: env.PUBLISH_LATEST == 'True'
        shell: bash
        run: |
          set -eu
          aws s3 cp "${MANIFEST_PATH}" "s3://${R2_BUCKET}/${MANIFEST_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type application/json \
            --cache-control "no-cache, max-age=0" \
            --only-show-errors

      - name: Summary
        shell: bash
        run: |
          {
            echo "## R2 ${CHANNEL}"
            echo
            echo "- version: \`${VERSION_NAME}\` (${VERSION_CODE})"
            echo "- APK: \`${APK_KEY}\`"
            echo "- manifest: \`${MANIFEST_KEY}\`"
            echo "- published: \`${PUBLISH_LATEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
