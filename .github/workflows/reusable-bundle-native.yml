name: Bundle Native

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Download geo artifact
        uses: actions/download-artifact@v8
        with:
          name: native-${{ inputs.channel }}-geo
          path: build/generated/assets/geo

      - name: Download arm64-v8a artifact
        uses: actions/download-artifact@v8
        with:
          name: native-${{ inputs.channel }}-arm64-v8a
          path: jniLibs/arm64-v8a

      - name: Verify bundled outputs
        shell: bash
        run: |
          set -eu
          abi=arm64-v8a
          test -f "jniLibs/${abi}/libmihomo.so"
          test -f "jniLibs/${abi}/libpreview.so"
          test -f "jniLibs/${abi}/libmihomocore.so"
          test -f "jniLibs/${abi}/liboverride.so"
          test -f "jniLibs/${abi}/libcompat.so"
          test -f "jniLibs/${abi}/libloader.so"
          test -f "jniLibs/${abi}/core-version.properties"
          # Promote one ABI stamp to the path Gradle prefers when present.
          mkdir -p build/generated
          cp -f jniLibs/arm64-v8a/core-version.properties build/generated/core-version.properties
          test -f "build/generated/assets/geo/geoip.metadb.xz"
          test -f "build/generated/assets/geo/geosite.dat.xz"
          test -f "build/generated/assets/geo/ASN.mmdb.xz"
          test ! -e "build/generated/assets/geo/BundleMRS.7z"

      - name: Upload native bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ inputs.channel }}
          path: |
            jniLibs
            build/generated/assets/geo
            build/generated/core-version.properties
          if-no-files-found: error
