name: Cleanup Artifacts

# Deletes this run's intermediate artifacts (native libs, geo payloads, raw
# APK stages) once the pipeline has succeeded, keeping only the user-facing
# APK artifacts (publish-* aggregates and per-ABI installers). Callers wire
# it behind their terminal jobs, so a failed run keeps everything for
# debugging and job re-runs.

on:
  workflow_call: { }

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete intermediate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("native-") or startswith("apk-raw-")) | .id')
          if [ -z "${ids}" ]; then
            echo "No intermediate artifacts to delete."
            exit 0
          fi
          for id in ${ids}; do
            echo "Deleting artifact id=${id}"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}"
          done
