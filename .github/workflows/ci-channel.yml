name: CI Channel

on:
  push:
    branches: [ "Yume", "Moe", "Dev" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "website/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-channel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# Version counter N = commit count of the built commit (`git rev-list --count HEAD`),
# computed inside reusable-build-apk-only.yml / reusable-prepare-publish.yml after their
# fetch-depth:0 checkouts - no build_number input is passed from here anymore. versionCode
# = project.version.code (gradle.properties) + N, one formula shared by channel, PR and
# official release builds, so releases get unique versionCodes in the same sequence as
# channel packages. Unlike the retired run_number scheme this survives workflow-file
# renames, and it stays monotonic vs already-published packages because the commit count
# grows with every commit and is >= the number of pushes >= run_number. If history is ever
# rewritten so the count shrinks, bump project.version.code above the last published versionCode.
jobs:
  validate-channel:
    name: "00 · Validate (arm64-v8a)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Verify channel build contract
        shell: bash
        run: |
          set -eu
          test "$(awk -F= '$1 == "abi.app.list" { print $2 }' gradle.properties)" = "arm64-v8a"
          test "$(awk -F= '$1 == "abi.extension.list" { print $2 }' gradle.properties)" = "arm64-v8a"
          test -f scripts/native-build.py
          test -f scripts/native/cli.py
          test -f scripts/native/go_core.py
          test -f lib/native/go/native/entry.go
          test -f lib/native/go/go.mod
          test -f lib/native/shell/CMakeLists.txt
          test -f lib/native/shell/shell.c
          test -f kernel.properties
          ! rg -q 'channel: smart|kernel_channel: smart|YumeBox-smart' .github/workflows/ci-channel.yml

  # Keep the channel and ABI as matrix inputs even while each has one supported value.
  # Adding a supported target later expands the graph without changing artifact wiring.
  build-geo-pre:
    name: "01 · Geo (${{ matrix.channel }})"
    needs: validate-channel
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: pre
    uses: ./.github/workflows/reusable-build-geo.yml
    with:
      channel: ${{ matrix.channel }}
    secrets: inherit

  build-native-abi-pre-arm64-v8a:
    name: "02 · Native (${{ matrix.abi }})"
    needs: validate-channel
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: pre
            kernel_channel: alpha
            abi: arm64-v8a
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: ${{ matrix.channel }}
      kernel_channel: ${{ matrix.kernel_channel }}
      abi: ${{ matrix.abi }}
    secrets: inherit

  build-telegram-bot-api:
    name: "02 · Telegram Bot API"
    needs: validate-channel
    uses: ./.github/workflows/reusable-build-telegram-bot-api.yml

  bundle-native-pre:
    name: "03 · Bundle (Pre)"
    needs:
      - build-geo-pre
      - build-native-abi-pre-arm64-v8a
    uses: ./.github/workflows/reusable-bundle-native.yml
    with:
      channel: pre
    secrets: inherit

  build-apk-pre-app:
    name: "05 · APK (Pre)"
    needs: bundle-native-pre
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: pre
      module: app
      release_tag: Pre-release
      meta_asset_name: YumeBox-pre-meta.json
      raw_apk_artifact_name: apk-raw-pre-app
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
    secrets: inherit

  verify-native-bundle:
    name: "04 · Verify bundle (arm64-v8a)"
    needs: bundle-native-pre
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Download bundled native artifact
        uses: actions/download-artifact@v8
        with:
          name: native-pre
          path: native

      - name: Verify bundled native files
        shell: bash
        run: |
          set -eu
          abi=arm64-v8a
          for file in libmihomo.so libpreview.so libmihomocore.so liboverride.so libcompat.so libloader.so core-version.properties; do
            test -s "native/jniLibs/${abi}/${file}"
          done
          for file in geoip.metadb.xz geosite.dat.xz ASN.mmdb.xz BundleMRS.7z; do
            test -s "native/build/generated/assets/geo/${file}"
          done

  prepare-publish-pre-app:
    name: "06 · Publish (Pre)"
    needs:
      - build-apk-pre-app
      - verify-native-bundle
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: pre
      module: app
      artifact_prefix: YumeBox
      release_tag: Pre-release
      meta_asset_name: YumeBox-pre-meta.json
      raw_apk_artifact_name: apk-raw-pre-app
      build_hash: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
      apk_name_tail: ${{ needs.build-apk-pre-app.outputs.apk_name_tail }}
    secrets: inherit

  notify-pre:
    name: "08 · Notify (Pre)"
    needs:
      - prepare-publish-pre-app
      - build-telegram-bot-api
    uses: ./.github/workflows/reusable-notify-telegram.yml
    with:
      channel: pre
      apk_artifact_name: ${{ needs.prepare-publish-pre-app.outputs.default_apk_name }}
      builtin_apk_artifact_name: ${{ needs.prepare-publish-pre-app.outputs.builtin_apk_name }}
      telegram_title: YumeBox Pre
    secrets: inherit

  verify-published-apk:
    name: "07 · Verify APK (arm64-v8a)"
    needs: prepare-publish-pre-app
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Download published APK artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-publish-pre-app.outputs.default_apk_name }}
          path: apk

      - name: Verify APK archive
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          apks=(apk/*.apk)
          test "${#apks[@]}" -eq 1
          unzip -t "${apks[0]}" >/dev/null

  cleanup-artifacts:
    name: "09 · Cleanup"
    needs:
      - notify-pre
      - verify-published-apk
    permissions:
      actions: write
    uses: ./.github/workflows/reusable-cleanup-artifacts.yml
