name: Publish Release

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      release_name:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      publish_artifacts:
        required: true
        type: string
      recreate_release:
        description: >-
          Rolling-tag mode: delete the existing release + tag before publishing so the
          recreated release gets a fresh created_at and stays on top of the releases list
          (CMFA-style Build Pre-Release flow). When false, the release is updated in place.
        required: true
        type: boolean

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download publish artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.publish_artifacts }}
          path: publish

      # Pre-releases describe only the commit they were built from; stable releases read
      # CHANGELOG.md, which holds only the notes of the release being published. GitHub's own
      # note generator is never used: for a rolling tag it accumulates every commit since the
      # last release.
      - name: Compose release body
        id: body
        shell: bash
        run: |
          set -eu
          mode="commit"
          if [ "${{ inputs.prerelease }}" != "true" ]; then
            mode="changelog"
          fi
          notes="$(python3 scripts/ci_release_notes.py \
            --mode "${mode}" \
            --tag "${{ inputs.release_tag }}" \
            --sha "$GITHUB_SHA")"
          {
            echo "notes<<__RELEASE_NOTES__"
            printf '%s\n' "${notes}"
            echo "__RELEASE_NOTES__"
          } >> "$GITHUB_OUTPUT"

      # Rolling pre-release: delete release + tag, then recreate below. Deleting the release
      # removes its assets with it, and the recreated release gets a fresh created_at so it
      # always sorts to the top of the releases list.
      - name: Delete existing release and tag for rolling tag
        if: inputs.recreate_release
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const tag = '${{ inputs.release_tag }}';
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id
              });
              core.info(`Deleted release ${release.data.id} for tag ${tag}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Release for tag ${tag} not found, skip delete.`);
              } else {
                throw error;
              }
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              core.info(`Deleted tag ref tags/${tag}`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info(`Tag ref tags/${tag} not found, skip delete.`);
              } else {
                throw error;
              }
            }

      - name: Publish release assets
        uses: softprops/action-gh-release@v3.0.3 # v3.0.3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          draft: false
          target_commitish: ${{ github.sha }}
          body: ${{ steps.body.outputs.notes }}
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: ${{ inputs.channel == 'stable' }}
          generate_release_notes: false
          files: publish/*.apk

      - name: Attest release APKs
        uses: actions/attest-build-provenance@v4.2.2 # v4.2.2
        with:
          subject-path: publish/*.apk
