name: Publish API Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version to publish (for example 0.1.0)"
        required: true
        type: string

concurrency:
  group: publish-api-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Publish API package
        run: >-
          ./gradlew :api:publishMavenPublicationToGitHubPackagesRepository
          --console=plain
          -Papi.version="${{ inputs.version }}"
