name: Build Geo

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build geo assets
        run: python3 scripts/native-build.py --geo

      - name: Verify geo outputs
        shell: bash
        run: |
          set -eu
          test -f "build/generated/assets/geo/geoip.metadb.xz"
          test -f "build/generated/assets/geo/geosite.dat.xz"
          test -f "build/generated/assets/geo/ASN.mmdb.xz"
          test -f "build/generated/assets/geo/BundleMRS.7z"

      - name: Upload geo artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ inputs.channel }}-geo
          path: |
            build/generated/assets/geo/geoip.metadb.xz
            build/generated/assets/geo/geosite.dat.xz
            build/generated/assets/geo/ASN.mmdb.xz
            build/generated/assets/geo/BundleMRS.7z
          if-no-files-found: error
          # Payloads are already XZ/7z-compressed; deflating the artifact zip again wastes CPU.
          compression-level: 0
