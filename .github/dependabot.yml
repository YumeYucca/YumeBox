version: 2

# Kotlin dependencies are declared in gradle/libs.versions.toml. Dependabot's
# Gradle updater requires a Gradle build, so this repository intentionally does
# not register a Gradle ecosystem; keep the Toolchain catalog updated here or
# through a catalog-aware updater.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /lib/native/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - rust
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /lib/native/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - go
    groups:
      native-go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /lib/mihomo
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - go
    groups:
      mihomo-go-dependencies:
        patterns:
          - "*"
